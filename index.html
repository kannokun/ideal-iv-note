<title>理想個体ノート</title>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout: モバイル1カラム + 下部タブ。GO風タイプアイコン、正方形カード、タイプ色ベースの詳細。 */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --line:#dfe4ef;
  --fg:#1b2130; --muted:#5d6782; --faint:#8a93ab;
  --accent:#2f8f83; --accent-fg:#ffffff;
  --sl:#2b6cb0; --ul:#b7791f; --ml:#7c4dcc;
  --shadow:#6b4a9e; --shiny:#d98a00; --lucky:#d98a00; --danger:#c0485a; --good:#2f9e6f;
  --shadow-soft:0 1px 2px rgba(20,28,48,.06),0 6px 18px rgba(20,28,48,.07);
  --radius:16px;
  --f-main:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-dot:"DotGothic16","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-num:"DotGothic16",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1b2030; --surface-2:#232a3d; --line:#2e3650;
  --fg:#e8ecf6; --muted:#9aa5c2; --faint:#6b7493;
  --accent:#4fc0b0; --accent-fg:#06211d;
  --sl:#6aa6e0; --ul:#e0b54e; --ml:#b793f0;
  --shadow:#b79be8; --shiny:#f0b64a; --lucky:#f0b64a; --danger:#e8788a; --good:#57c796;
  --shadow-soft:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b2030; --surface-2:#232a3d; --line:#2e3650;
  --fg:#e8ecf6; --muted:#9aa5c2; --faint:#6b7493;
  --accent:#4fc0b0; --accent-fg:#06211d;
  --sl:#6aa6e0; --ul:#e0b54e; --ml:#b793f0;
  --shadow:#b79be8; --shiny:#f0b64a; --lucky:#f0b64a; --danger:#e8788a; --good:#57c796;
  --shadow-soft:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px}
:root{--pkred:#ee5a52}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-main);font-size:1rem;line-height:1.55;-webkit-text-size-adjust:100%}
/* ドットフォント（DotGothic16）は“見せる文字”に限定。説明文は丸ゴシックのまま。擬似ボールドは無効化してドットを崩さない */
.brand,.sec-label,.c-name,.hero-name,.lg-tab,.tbadge,.chip,.coll-group h3,.card h2,.count-note,.rk-no,.filt-btn,.iname{font-family:var(--f-dot);font-synthesis:none;letter-spacing:.02em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:1rem}
.num{font-variant-numeric:tabular-nums}

#app{min-height:100%;display:flex;flex-direction:column}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.bar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--sl),var(--pkred) 38%,var(--ul) 66%,var(--ml))}
.bar-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:11px;display:flex;align-items:center;gap:9px}
.brand{font-weight:800;font-size:1.12rem;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand .dot{width:19px;height:19px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px #2a2a2a,0 1px 2px rgba(0,0,0,.2);
  background:radial-gradient(circle at 50% 50%,#fff 0 2.6px,#2a2a2a 2.6px 3.8px,transparent 3.8px),
  linear-gradient(to bottom,var(--pkred) 0 45%,#2a2a2a 45% 55%,#fff 55% 100%)}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}

.search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px;box-shadow:var(--shadow-soft)}
.search input{border:0;background:transparent;color:var(--fg);width:100%;outline:none;font-size:1.05rem}
.search svg{flex:none;color:var(--faint)}
.sec-label{font-size:.82rem;font-weight:800;color:var(--faint);letter-spacing:.08em;margin:18px 2px 8px}

/* icon grids (type / region / rarity) */
.icongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icongrid.c3{grid-template-columns:repeat(3,1fr)}
.icell{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;padding:4px 0;color:inherit}
.icirc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;box-shadow:var(--shadow-soft);border:3px solid transparent;transition:transform .08s}
.icell[aria-pressed="true"] .icirc{border-color:var(--fg);transform:scale(1.07)}
.icell:active .icirc{transform:scale(.95)}
.iname{font-size:.8rem;font-weight:700}
.inum{font-size:.72rem;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}

/* search bar as filter entry */
.searchbar{width:100%;display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px;box-shadow:var(--shadow-soft);color:var(--faint)}
.searchbar:active{transform:scale(.99)}
.searchbar svg{flex:none}
.searchbar .sb-text{flex:1;min-width:0;text-align:left;font-size:.95rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbar .sb-text.has{color:var(--fg);font-weight:700}
.searchbar .sb-tune{flex:none;font-size:1.1rem;color:var(--accent)}
.clearbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.85rem}
/* filter entry line */
.filt-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.filt-btn{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:800;font-size:.98rem;display:inline-flex;align-items:center;gap:7px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-weight:700;font-size:.85rem}
.fchip .x{color:var(--faint);font-weight:800;font-size:1rem}

/* species cards */
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px;margin-top:14px}
.sp-card{position:relative;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;color:inherit;overflow:hidden;text-align:center}
.sp-card:active{transform:scale(.96)}
.sp-card .band{position:relative;height:50px;padding:7px 9px;overflow:hidden}
.sp-card .c-dex{position:relative;z-index:1;font-family:var(--f-num);font-weight:800;font-size:.72rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.sp-card .c-own{position:absolute;top:7px;right:7px;z-index:2;font-size:.58rem;font-weight:800;color:#2e9e6f;background:#fff;padding:2px 6px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sp-card .ball{position:absolute;right:-10px;bottom:-14px;width:44px;height:44px;border-radius:50%;opacity:.5;
  background:radial-gradient(circle at 50% 50%,#fff 0 4px,transparent 5px),linear-gradient(to bottom,rgba(255,255,255,.5) 0 46%,#fff 46% 54%,rgba(255,255,255,.22) 54% 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.sp-card .c-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px 11px}
.sp-card .c-name{font-weight:400;font-size:1.02rem;line-height:1.18;-webkit-text-stroke:.55px currentColor;text-stroke:.55px currentColor}
.sp-card .c-types{display:flex;gap:5px}
.mini-t{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 1px 1px rgba(0,0,0,.12)}
.count-note{text-align:center;color:var(--faint);font-size:.82rem;margin-top:12px;grid-column:1/-1}

/* apply bar */
.applybar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-left,0px))}
.applybar .btn{width:100%;max-width:560px;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.fhead b{font-size:1.15rem}

/* detail */
.back{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.92rem;display:inline-flex;gap:6px;align-items:center;margin-bottom:12px}
.hero{border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-soft)}
.hero::after{content:"";position:absolute;right:-26px;top:-26px;width:120px;height:120px;border-radius:50%;border:13px solid rgba(255,255,255,.16);opacity:1;pointer-events:none}
.hero::before{content:"";position:absolute;right:16px;top:30px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:0 0 0 5px rgba(255,255,255,.14);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-dex{font-family:var(--f-num);font-size:.92rem;opacity:.9}
.hero-name{font-size:1.75rem;margin:2px 0 10px;color:#fff;-webkit-text-stroke:.7px #fff;text-stroke:.7px #fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.hero-types{display:flex;gap:6px}
.tbadge{font-size:.82rem;font-weight:700;color:#fff;padding:4px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.hero .tbadge{background:rgba(255,255,255,.24)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 15px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{color:#fff;background:var(--theme,var(--accent));border-color:transparent}
.lg-tabs{display:flex;gap:8px;margin:12px 0 4px}
.lg-tab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 6px;font-weight:800;font-size:.95rem;color:var(--muted)}
.lg-tab .lg-cap{display:block;font-size:.7rem;font-weight:700;color:var(--faint);margin-top:2px}
.lg-tab[aria-pressed="true"][data-lg="1"]{color:#fff;background:var(--sl);border-color:transparent}
.lg-tab[aria-pressed="true"][data-lg="2"]{color:#3a2d06;background:var(--ul);border-color:transparent}
.lg-tab[aria-pressed="true"][data-lg="3"]{color:#fff;background:var(--ml);border-color:transparent}
.lg-tab[aria-pressed="true"] .lg-cap{color:inherit;opacity:.85}

.ranks{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.rk{background:color-mix(in srgb,var(--theme,transparent) 7%,var(--surface));border:1px solid var(--line);border-left:5px solid var(--theme,var(--line));border-radius:12px;padding:13px 15px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:10px}
.rk.owned{border-color:color-mix(in srgb,var(--good) 55%,var(--line));border-left-color:var(--good)}
.rk-top{display:flex;align-items:center;gap:12px}
.rk-no{width:32px;height:32px;flex:none;border-radius:9px;background:var(--surface-2);color:var(--muted);font-weight:800;display:grid;place-items:center;font-size:.95rem}
.rk.owned .rk-no{background:var(--good);color:#fff}
.iv{font-family:var(--f-num);font-weight:700;font-size:1.15rem}
.rk-meta{margin-left:auto;text-align:right;color:var(--muted);font-size:.82rem;font-family:var(--f-num)}
.rk-meta b{color:var(--fg);font-size:.98rem}
.addbtn{flex:none;border:1px dashed var(--line);background:var(--surface);color:var(--accent);border-radius:10px;padding:8px 11px;font-weight:800;font-size:.85rem}
.haves{display:flex;flex-wrap:wrap;gap:6px}
.have{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 11px;font-size:.8rem;font-weight:700}
.tag{font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:999px;line-height:1}
.t-sh{color:#fff;background:var(--shadow)} .t-pu{color:#fff;background:#3f8f6a}
.t-xl{color:#fff;background:#c0485a} .t-xs{color:#fff;background:#4a74c0}
.t-shiny{color:#3a2d06;background:var(--shiny)} .t-lucky{color:#3a2d06;background:var(--lucky)}
.have .del{border:0;background:transparent;color:var(--faint);font-weight:800;font-size:1.05rem;line-height:1;padding:0 2px}

.stats{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-soft)}
.stat-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.stat-top .ico{font-size:1.1rem} .stat-top b{font-size:1rem}
.stat-top .frac{margin-left:auto;font-family:var(--f-num);font-weight:800;color:var(--muted)}
.stat-top .comp{margin-left:auto;font-weight:800;color:var(--good);font-size:.9rem}
.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ml));border-radius:999px}
.stat.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.coll-group{margin-top:16px}
.coll-group h3{font-size:1.05rem;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.coll-group h3 .g-dex{font-family:var(--f-num);color:var(--faint);font-size:.82rem;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.15rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:12px 14px;outline:none}
.field input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn{border:0;border-radius:11px;padding:13px 16px;font-weight:800;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
.msg{font-size:.88rem;color:var(--muted)} .msg.err{color:var(--danger)} .msg.ok{color:var(--good)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:38;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--faint);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet h3{font-size:1.1rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:76px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:11px 6px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tgl{flex:1;min-width:130px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 13px;font-weight:700;font-size:.95rem}
.tgl input{width:22px;height:22px;accent-color:var(--accent)}
.sheet .row2{display:flex;gap:10px}
.loading{color:var(--muted);text-align:center;padding:34px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--radius);margin-top:16px}
.empty b{color:var(--fg);display:block;margin-bottom:6px;font-size:1.05rem}
.note{font-size:.84rem;color:var(--faint);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>


<div id="app">
  <header class="bar"><div class="bar-in"><div class="brand"><span class="dot"></span>理想個体ノート</div></div></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="search" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>検索</button>
    <button data-tab="collection" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>手持ち</button>
    <button data-tab="account" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>アカウント</button>
  </nav>
</div>

<script>
const SB_URL="https://jhzukqbdlhmxnvkehxhg.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoenVrcWJkbGhteG52a2VoeGhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTkwNzAsImV4cCI6MjEwNzc3NTA3MH0.gGYv6XbwmJiI0SDN0nOnJgG4kryL_JB0RIO7DEEJOls";
const VERSION="2026-10-24h";
// 認証も supabase-js を使わず REST を直接叩く（GoTrueのロックでiOS Safariが固まる問題を根絶）。
let auth=loadAuth();                 // {access_token, refresh_token, user} | null
function loadAuth(){try{return JSON.parse(localStorage.getItem("iv_auth")||"null");}catch(_){return null;}}
function saveAuth(a){auth=a;try{a?localStorage.setItem("iv_auth",JSON.stringify(a)):localStorage.removeItem("iv_auth");}catch(_){}}
async function authPost(path,body){
  const r=await fetch(`${SB_URL}/auth/v1/${path}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.error||j.message||`${r.status}`);
  return j;
}
async function signIn(email,password){const j=await authPost("token?grant_type=password",{email,password});saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return j;}
async function signUp(email,password){const j=await authPost("signup",{email,password});if(j.access_token)saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return j;}
async function refreshAuth(){
  if(!auth||!auth.refresh_token)return false;
  try{const j=await authPost("token?grant_type=refresh_token",{refresh_token:auth.refresh_token});saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return true;}
  catch(_){saveAuth(null);return false;}
}
// user_collection(本人データ)はアクセストークンで直接fetch。401は自動リフレッシュして1回だけ再試行。
async function dbUser(method,query,body){
  if(!auth)throw new Error("ログインが必要です");
  const run=()=>fetch(`${SB_URL}/rest/v1/${query}`,{method,headers:{apikey:SB_KEY,Authorization:`Bearer ${auth.access_token}`,"Content-Type":"application/json",...(method==="POST"?{Prefer:"return=representation"}:{})},body:body?JSON.stringify(body):undefined});
  let r=await run();
  if(r.status===401&&await refreshAuth())r=await run();
  return r;
}
// 公開参照データ(種族/フォーム/個体値)は supabase-js を介さず匿名キーで直接取得する。
// → ログイン状態・認証トークン・GoTrueのロックに一切左右されず、常に読める。
async function pubGet(pathAndQuery){
  const r=await fetch(`${SB_URL}/rest/v1/${pathAndQuery}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,Accept:"application/json"}});
  if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

const LEAGUES={1:{name:"スーパー",cap:"CP1500"},2:{name:"ハイパー",cap:"CP2500"},3:{name:"マスター",cap:"制限なし"}};
const TYPES=[["normal","ノーマル","#9298a3","⚪"],["fire","ほのお","#f05a3f","🔥"],["water","みず","#3692dc","💧"],["grass","くさ","#4aa84a","🍃"],["electric","でんき","#e0bb2e","⚡"],["ice","こおり","#5cc6d0","❄️"],["fighting","かくとう","#d8433f","🥊"],["poison","どく","#9a5bc2","☠️"],["ground","じめん","#cf9b50","⛰️"],["flying","ひこう","#8aa7e0","🕊️"],["psychic","エスパー","#ef6aa0","🔮"],["bug","むし","#9bb52b","🐛"],["rock","いわ","#b6a95f","🪨"],["ghost","ゴースト","#6b5a99","👻"],["dragon","ドラゴン","#5a66d8","🐉"],["dark","あく","#6d5a56","🌙"],["steel","はがね","#6aa5bc","⚙️"],["fairy","フェアリー","#e48ad8","✨"]];
const TYPEMAP=Object.fromEntries(TYPES.map(t=>[t[0],t]));
const RARITY=[["legendary","伝説","#b07b2e","👑"],["mythical","幻","#b5497f","🌟"],["ultra_beast","UB","#3f9f8f","🛸"]];
const REGIONS=[["カントー",1,151,"🗼"],["ジョウト",152,251,"⛩️"],["ホウエン",252,386,"🌊"],["シンオウ",387,493,"⛰️"],["イッシュ",494,649,"🗽"],["カロス",650,721,"🥐"],["アローラ",722,809,"🌺"],["ガラル",810,898,"🏰"],["ヒスイ",899,905,"🏔️"],["パルデア",906,1025,"🌅"]];

const main=document.getElementById("main");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let activeTab="search";
let speciesAll=[], formsByDex={}, formCache={}, speciesName={}, typeCount={}, regionCount=[], rarityCount={}, ownedDex=new Set();

const tabs=document.getElementById("tabs");
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(b)switchTab(b.dataset.tab);});
function switchTab(t){activeTab=t;[...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  if(t==="search")renderSearch();else if(t==="collection")renderCollection();else renderAccount();}

async function fetchAll(table,cols,order){
  // PostgRESTの1000行上限を回避するためページング取得（匿名キー直接fetch）
  try{
    const all=[]; let from=0; const size=1000;
    for(;;){
      const data=await pubGet(`${table}?select=${encodeURIComponent(cols)}&order=${order}&limit=${size}&offset=${from}`);
      all.push(...data);
      if(data.length<size)break;
      from+=size;
    }
    return{data:all};
  }catch(e){return{error:e}}
}
async function boot(){
  main.innerHTML=`<div class="loading">データを読み込み中…</div>`;
  // 公開データの取得はセッション取得から完全に切り離す（getSessionがハングしても閲覧は止めない）
  const [sp,fm]=await Promise.all([
    fetchAll("pokemon_species","dex,name_ja,family_id","dex"),
    fetchAll("pokemon_forms","id,dex,region,form,species_en,type1,type2,rarity","id")
  ]);
  if(sp.error||fm.error){main.innerHTML=`<div class="empty"><b>読み込みエラー</b>${esc((sp.error||fm.error).message)}</div>`;return;}
  speciesAll=sp.data;
  if(!speciesAll.length){main.innerHTML=`<div class="empty"><b>データ0件（${VERSION}）</b>接続は成功しましたが種族データが0件でした。お手数ですがこの画面を報告してください。</div>`;return;}
  speciesAll.forEach(s=>speciesName[s.dex]=s.name_ja);
  fm.data.forEach(f=>{formCache[f.id]=f;(formsByDex[f.dex]=formsByDex[f.dex]||[]).push(f);});
  TYPES.forEach(t=>typeCount[t[0]]=0); RARITY.forEach(r=>rarityCount[r[0]]=0);
  speciesAll.forEach(s=>{const ts=new Set(),rs=new Set();(formsByDex[s.dex]||[]).forEach(f=>{if(f.type1)ts.add(f.type1);if(f.type2)ts.add(f.type2);if(f.rarity)rs.add(f.rarity);});ts.forEach(t=>{if(typeCount[t]!=null)typeCount[t]++;});rs.forEach(r=>{if(rarityCount[r]!=null)rarityCount[r]++;});});
  regionCount=REGIONS.map(([,lo,hi])=>speciesAll.filter(s=>s.dex>=lo&&s.dex<=hi).length);
  switchTab("search");            // 公開データが揃った時点で即描画（認証を待たない）
  initSession();                  // 認証は localStorage から即復元（ハングしない）
}
async function initSession(){
  // auth は起動時に localStorage から同期復元済み。裏で所持データを取得して再描画するだけ。
  if(auth)await loadOwnedDex();
  if(activeTab==="account")renderAccount();
  else if(activeTab==="collection")renderCollection();
}
async function loadOwnedDex(){ownedDex=new Set();if(!auth)return;try{const r=await dbUser("GET","user_collection?select=form_id");if(r.ok){const data=await r.json();(data||[]).forEach(row=>{const f=formCache[row.form_id];if(f)ownedDex.add(f.dex);});}}catch(_){}}

/* ---------- SEARCH (results view + filter view) ---------- */
let searchState={q:"",type:null,rarity:null,region:null};
let searchView="list";
function activeFilters(){const a=[];if(searchState.type)a.push(["type",TYPEMAP[searchState.type][1],TYPEMAP[searchState.type][3]]);if(searchState.region!=null)a.push(["region",REGIONS[searchState.region][0],REGIONS[searchState.region][3]]);if(searchState.rarity){const r=RARITY.find(x=>x[0]===searchState.rarity);a.push(["rarity",r[1],r[3]]);}return a;}
function renderSearch(){ if(searchView==="filter")renderFilter(); else renderResults(); }

function renderResults(){
  const af=activeFilters();
  const barTxt=searchState.q.trim()?esc(searchState.q):"名前・図鑑番号で検索";
  main.innerHTML=`
    <button class="searchbar" id="openfilter">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <span class="sb-text${searchState.q.trim()?" has":""}">${barTxt}</span>
      <span class="sb-tune">⚙</span>
    </button>
    ${af.length?`<div class="filt-line">${af.map(f=>`<span class="fchip" data-k="${f[0]}">${f[2]} ${esc(f[1])}<button class="x" data-k="${f[0]}">×</button></span>`).join("")}</div>`:""}
    <div class="sp-grid" id="splist"></div>`;
  document.getElementById("openfilter").addEventListener("click",()=>{searchView="filter";renderSearch();});
  main.querySelectorAll(".fchip .x").forEach(b=>b.addEventListener("click",ev=>{ev.stopPropagation();const k=b.dataset.k;if(k==="type")searchState.type=null;if(k==="region")searchState.region=null;if(k==="rarity")searchState.rarity=null;renderResults();}));
  paintResults();
}
function renderFilter(){
  main.innerHTML=`
    <div class="fhead"><button class="back" id="fclose">‹ 戻る</button><b>検索・絞り込み</b><button class="clearbtn" id="fclear" style="margin-left:auto">クリア</button></div>
    <label class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" inputmode="search" placeholder="名前か図鑑番号（進化系統も表示）" value="${esc(searchState.q)}" autocomplete="off">
    </label>
    <p class="note" style="margin:8px 2px 0">例：「イーブイ」でブラッキー等の進化系統も表示。コミュデイのタネ確認に便利。</p>
    <div class="sec-label">タイプ</div>
    <div class="icongrid" id="fg-type">${TYPES.map(t=>`<button class="icell" data-t="${t[0]}" aria-pressed="${searchState.type===t[0]}"><span class="icirc" style="background:${t[2]}">${t[3]}</span><span class="iname">${t[1]}</span><span class="inum">${typeCount[t[0]]||0}</span></button>`).join("")}</div>
    <div class="sec-label">地方</div>
    <div class="icongrid" id="fg-reg">${REGIONS.map((r,i)=>`<button class="icell" data-i="${i}" aria-pressed="${searchState.region===i}"><span class="icirc" style="background:var(--surface-2)">${r[3]}</span><span class="iname">${r[0]}</span><span class="inum">${regionCount[i]||0}</span></button>`).join("")}</div>
    <div class="sec-label">レア度</div>
    <div class="icongrid c3" id="fg-rar">${RARITY.map(r=>`<button class="icell" data-r="${r[0]}" aria-pressed="${searchState.rarity===r[0]}"><span class="icirc" style="background:${r[2]}">${r[3]}</span><span class="iname">${r[1]}</span><span class="inum">${rarityCount[r[0]]||0}</span></button>`).join("")}</div>
    <div style="height:84px"></div>
    <div class="applybar"><button class="btn" id="apply">この条件で表示（<span id="fcount">${filteredSpecies().length}</span>件）</button></div>`;
  const upd=()=>{const el=document.getElementById("fcount");if(el)el.textContent=filteredSpecies().length;};
  const qi=document.getElementById("q");
  qi.addEventListener("input",e=>{searchState.q=e.target.value;upd();});
  qi.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchView="list";renderSearch();}});
  document.getElementById("fclose").addEventListener("click",()=>{searchView="list";renderSearch();});
  document.getElementById("fclear").addEventListener("click",()=>{searchState={q:"",type:null,rarity:null,region:null};renderFilter();});
  document.getElementById("fg-type").addEventListener("click",e=>{const b=e.target.closest(".icell");if(!b)return;searchState.type=searchState.type===b.dataset.t?null:b.dataset.t;b.setAttribute("aria-pressed",searchState.type===b.dataset.t);main.querySelectorAll('#fg-type .icell').forEach(x=>x.setAttribute("aria-pressed",searchState.type===x.dataset.t));upd();});
  document.getElementById("fg-reg").addEventListener("click",e=>{const b=e.target.closest(".icell");if(!b)return;const i=+b.dataset.i;searchState.region=searchState.region===i?null:i;main.querySelectorAll('#fg-reg .icell').forEach(x=>x.setAttribute("aria-pressed",searchState.region===+x.dataset.i));upd();});
  document.getElementById("fg-rar").addEventListener("click",e=>{const b=e.target.closest(".icell");if(!b)return;searchState.rarity=searchState.rarity===b.dataset.r?null:b.dataset.r;main.querySelectorAll('#fg-rar .icell').forEach(x=>x.setAttribute("aria-pressed",searchState.rarity===x.dataset.r));upd();});
  document.getElementById("apply").addEventListener("click",()=>{searchView="list";renderSearch();});
}
function filteredSpecies(){
  let arr=speciesAll; const v=searchState.q.trim();
  if(/^\d+$/.test(v))arr=arr.filter(s=>s.dex===+v);
  else if(v){
    const fams=new Set();
    speciesAll.forEach(s=>{if((s.name_ja||"").includes(v))fams.add(s.family_id);});
    arr=arr.filter(s=>fams.has(s.family_id));
  }
  if(searchState.region!=null){const[,lo,hi]=REGIONS[searchState.region];arr=arr.filter(s=>s.dex>=lo&&s.dex<=hi);}
  if(searchState.type||searchState.rarity)arr=arr.filter(s=>(formsByDex[s.dex]||[]).some(f=>(!searchState.type||f.type1===searchState.type||f.type2===searchState.type)&&(!searchState.rarity||f.rarity===searchState.rarity)));
  return arr;
}
function paintResults(){
  const list=document.getElementById("splist"); if(!list)return;
  const data=filteredSpecies();
  if(!data.length){list.innerHTML=`<div class="empty" style="grid-column:1/-1"><b>該当なし</b>条件を変えてみてください。</div>`;return;}
  // 全件表示（イベント委譲でカードが多くても軽量）
  list.innerHTML=data.map(s=>{
    const fs=formsByDex[s.dex]||[]; const tset=[]; fs.forEach(f=>{[f.type1,f.type2].forEach(t=>{if(t&&!tset.includes(t))tset.push(t);});});
    const t1=TYPEMAP[tset[0]], t2=TYPEMAP[tset[1]];
    const c1=(t1||[])[2]||'#9298a3', c2=(t2||t1||[])[2]||c1;
    const chips=tset.slice(0,2).map(t=>{const m=TYPEMAP[t];return m?`<span class="mini-t" style="background:${m[2]}">${m[3]}</span>`:"";}).join("");
    return `<button class="sp-card" data-dex="${s.dex}" data-name="${esc(s.name_ja)}">
      <div class="band" style="background:linear-gradient(135deg,${c1},${c2})">
        <span class="c-dex">No.${s.dex}</span><span class="ball"></span>
        ${ownedDex.has(s.dex)?`<span class="c-own">所持</span>`:""}
      </div>
      <div class="c-body"><span class="c-name">${esc(s.name_ja)}</span><span class="c-types">${chips}</span></div>
    </button>`;
  }).join("")+`<div class="count-note">全 ${data.length} 件</div>`;
  if(!list.dataset.bound){list.dataset.bound="1";list.addEventListener("click",e=>{const b=e.target.closest(".sp-card");if(b)openSpecies(+b.dataset.dex,b.dataset.name);});}
}

/* ---------- DETAIL ---------- */
let detail={dex:null,name:"",forms:[],formId:null,league:1};
function openSpecies(dex,name){
  const fs=(formsByDex[dex]||[]).slice().sort((a,b)=>{const ab=(!a.region&&!a.form)?0:1,bb=(!b.region&&!b.form)?0:1;return ab-bb||a.id-b.id;});
  detail={dex,name,forms:fs,formId:fs[0]?.id??null,league:1};
  renderDetail();
}
function formLabel(f){return f.region||f.form||"通常";}
function typeBadges(f){if(!f)return"";return [f.type1,f.type2].filter(Boolean).map(t=>{const m=TYPEMAP[t];return m?`<span class="tbadge">${m[3]} ${m[1]}</span>`:"";}).join("");}
function renderDetail(){
  const fs=detail.forms, cur=fs.find(f=>f.id===detail.formId);
  const c1=(TYPEMAP[cur&&cur.type1]||[])[2]||'#7a8296';
  const c2=(TYPEMAP[cur&&cur.type2]||TYPEMAP[cur&&cur.type1]||[])[2]||c1;
  main.innerHTML=`
    <button class="back" id="back">‹ もどる</button>
    <div class="hero" style="background:linear-gradient(135deg,${c1},${c2})">
      <div class="hero-dex num">No.${detail.dex}</div>
      <h2 class="hero-name">${esc(detail.name)}</h2>
      <div class="hero-types">${typeBadges(cur)}</div>
    </div>
    ${fs.length>1?`<div class="chips" id="formchips" style="--theme:${c1}">${fs.map(f=>`<button class="chip" data-id="${f.id}" aria-pressed="${f.id===detail.formId}">${esc(formLabel(f))}</button>`).join("")}</div>`:`<div style="height:4px"></div>`}
    <div class="lg-tabs" id="lgtabs">${[1,2,3].map(l=>`<button class="lg-tab" data-lg="${l}" aria-pressed="${l===detail.league}">${LEAGUES[l].name}<span class="lg-cap">${LEAGUES[l].cap}</span></button>`).join("")}</div>
    <div class="ranks" id="ranks" style="--theme:${c1}"></div>`;
  document.getElementById("back").addEventListener("click",()=>switchTab("search"));
  const fc=document.getElementById("formchips"); if(fc)fc.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){detail.formId=+b.dataset.id;renderDetail();}});
  document.getElementById("lgtabs").addEventListener("click",e=>{const b=e.target.closest(".lg-tab");if(b){detail.league=+b.dataset.lg;renderDetail();}});
  loadRanking();
}
async function loadRanking(){
  const box=document.getElementById("ranks"); box.innerHTML=`<div class="loading">理想個体を取得中…</div>`;
  const fid=detail.formId,lg=detail.league;
  // 個体値(公開データ)は匿名キーで直接取得＝ログイン状態に影響されない
  let ideal;
  try{ideal=await pubGet(`ideal_ivs?select=rank,atk_iv,def_iv,hp_iv,level,cp&form_id=eq.${fid}&league_id=eq.${lg}&order=rank`);}
  catch(e){box.innerHTML=`<div class="empty">読み込みエラー：${esc(e.message)}</div>`;return;}
  // 手持ちは認証クライアント。失敗しても個体値表示は止めない
  let owned=[]; try{owned=await loadOwned(fid,lg);}catch(_){owned=[];}
  const byRank={}; owned.forEach(o=>{(byRank[o.rank]=byRank[o.rank]||[]).push(o);});
  box.innerHTML=ideal.map(r=>{const haves=byRank[r.rank]||[];
    return `<div class="rk${haves.length?" owned":""}"><div class="rk-top">
      <span class="rk-no num">${r.rank}</span><span class="iv num">${r.atk_iv}/${r.def_iv}/${r.hp_iv}</span>
      <span class="rk-meta"><b>${r.cp}</b> CP<br>Lv${(+r.level).toFixed(1)}</span>
      <button class="addbtn" data-rank="${r.rank}">＋登録</button>
    </div>${haves.length?`<div class="haves">${haves.map(haveChip).join("")}</div>`:""}</div>`;
  }).join("");
  box.querySelectorAll(".addbtn").forEach(b=>b.addEventListener("click",()=>openRegister(+b.dataset.rank)));
  box.querySelectorAll(".have .del").forEach(b=>b.addEventListener("click",()=>deleteHave(+b.dataset.id)));
}
async function loadOwned(fid,lg){if(!auth)return[];try{const r=await dbUser("GET",`user_collection?select=id,rank,is_shadow,is_purified,is_shiny,is_lucky,size&form_id=eq.${fid}&league_id=eq.${lg}`);return r.ok?await r.json():[];}catch(_){return[];}}
function haveChip(o){const tags=[];
  if(o.is_shadow)tags.push(`<span class="tag t-sh">S</span>`); if(o.is_purified)tags.push(`<span class="tag t-pu">浄</span>`);
  if(o.size==="XXL")tags.push(`<span class="tag t-xl">XXL</span>`); if(o.size==="XXS")tags.push(`<span class="tag t-xs">XXS</span>`);
  if(o.is_shiny)tags.push(`<span class="tag t-shiny">色</span>`); if(o.is_lucky)tags.push(`<span class="tag t-lucky">キラ</span>`);
  return `<span class="have">所持${tags.join("")}<button class="del" data-id="${o.id}" title="削除">×</button></span>`;}

/* ---------- REGISTER ---------- */
function openRegister(rank){
  if(!auth){toast("登録にはログインが必要です");switchTab("account");return;}
  const f=formCache[detail.formId];
  const scrim=document.createElement("div");scrim.className="scrim";
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <h3>${esc(detail.name)}${f&&formLabel(f)!=="通常"?"（"+esc(formLabel(f))+"）":""}・${LEAGUES[detail.league].name} 第${rank}位を登録</h3>
    <div class="field"><label>状態</label><div class="seg" id="st"><button data-v="normal" aria-pressed="true">通常</button><button data-v="shadow" aria-pressed="false">シャドウ</button><button data-v="purified" aria-pressed="false">リトレーン</button></div></div>
    <div class="field"><label>サイズ</label><div class="seg" id="sz"><button data-v="通常" aria-pressed="true">通常</button><button data-v="XXL" aria-pressed="false">XXL</button><button data-v="XXS" aria-pressed="false">XXS</button></div></div>
    <div class="toggles"><label class="tgl">色違い<input type="checkbox" id="shiny"></label><label class="tgl">キラ<input type="checkbox" id="lucky"></label></div>
    <div class="field"><label>メモ（任意）</label><input id="memo" placeholder="例：交換用 / 2体目"></div>
    <div class="msg" id="rmsg"></div>
    <div class="row2"><button class="btn ghost" id="cancel" style="flex:1">やめる</button><button class="btn" id="save" style="flex:2">登録する</button></div></div>`;
  document.body.appendChild(scrim);
  scrim.addEventListener("click",e=>{if(e.target===scrim)scrim.remove();});
  scrim.querySelector("#st").addEventListener("click",seg);
  scrim.querySelector("#sz").addEventListener("click",seg);
  scrim.querySelector("#cancel").addEventListener("click",()=>scrim.remove());
  scrim.querySelector("#save").addEventListener("click",async()=>{
    const btn=scrim.querySelector("#save");btn.disabled=true;
    const status=scrim.querySelector("#st").querySelector('[aria-pressed="true"]').dataset.v;
    const row={form_id:detail.formId,league_id:detail.league,rank,is_shadow:status==="shadow",is_purified:status==="purified",
      is_shiny:scrim.querySelector("#shiny").checked,is_lucky:scrim.querySelector("#lucky").checked,
      size:scrim.querySelector("#sz").querySelector('[aria-pressed="true"]').dataset.v,memo:scrim.querySelector("#memo").value.trim()||null};
    try{
      const r=await dbUser("POST","user_collection",row);
      if(!r.ok){const t=await r.text();throw new Error(`${r.status} ${t}`);}
    }catch(e){scrim.querySelector("#rmsg").className="msg err";scrim.querySelector("#rmsg").textContent="登録できませんでした："+e.message;btn.disabled=false;return;}
    ownedDex.add(detail.dex);scrim.remove();toast("登録しました");loadRanking();
  });
}
function seg(e){const b=e.target.closest("button");if(!b)return;[...b.parentElement.children].forEach(x=>x.setAttribute("aria-pressed",x===b));}
async function deleteHave(id){try{const r=await dbUser("DELETE",`user_collection?id=eq.${id}`);if(r.ok){toast("削除しました");await loadOwnedDex();loadRanking();}}catch(_){}}

/* ---------- COLLECTION ---------- */
async function renderCollection(){
  if(!auth){main.innerHTML=`<div class="empty"><b>ログインすると手持ちを記録できます</b>アカウントタブからログイン後、各ランクの「＋登録」で追加できます。</div>`;return;}
  main.innerHTML=`<div class="loading">手持ちを読み込み中…</div>`;
  let data;
  try{const r=await dbUser("GET","user_collection?select=id,form_id,league_id,rank,is_shadow,is_purified,is_shiny,is_lucky,size,memo&order=created_at.desc");if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);data=await r.json();}
  catch(e){main.innerHTML=`<div class="empty">読み込みエラー：${esc(e.message)}</div>`;return;}
  const owned=new Set(); data.forEach(d=>{const f=formCache[d.form_id];if(f)owned.add(f.dex);}); ownedDex=owned;
  const stats=REGIONS.map(([name,lo,hi],i)=>({name,ico:REGIONS[i][3],total:regionCount[i],own:[...owned].filter(d=>d>=lo&&d<=hi).length})).filter(r=>r.total>0);
  let html=`<div class="sec-label">地方コンプ状況（アプリ収録種のうち所持数）</div><div class="stats">`+
    stats.map(r=>{const pct=r.total?Math.round(r.own/r.total*100):0;const done=r.own>=r.total&&r.total>0;
      return `<div class="stat${done?" done":""}"><div class="stat-top"><span class="ico">${r.ico}</span><b>${r.name}</b>${done?`<span class="comp">コンプ！🎉</span>`:`<span class="frac">${r.own} / ${r.total}</span>`}</div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
    }).join("")+`</div>`;
  if(!data.length){html+=`<div class="empty"><b>まだ手持ちがありません</b>検索からポケモンを開き「＋登録」で追加しましょう。</div>`;main.innerHTML=html;return;}
  const groups={}; data.forEach(d=>{const dx=(formCache[d.form_id]||{}).dex;(groups[dx]=groups[dx]||[]).push(d);});
  html+=`<div class="sec-label">所持個体（${data.length}体）</div>`+Object.keys(groups).sort((a,b)=>a-b).map(dx=>`
    <div class="coll-group"><h3>${esc(speciesName[dx]||"No."+dx)}<span class="g-dex num">No.${dx}</span></h3>
      <div class="ranks">${groups[dx].map(collCard).join("")}</div></div>`).join("");
  main.innerHTML=html;
  main.querySelectorAll(".have .del").forEach(b=>b.addEventListener("click",async()=>{try{await dbUser("DELETE",`user_collection?id=eq.${+b.dataset.id}`);}catch(_){}renderCollection();}));
}
function collCard(o){const f=formCache[o.form_id]||{};const fl=formLabel(f);
  return `<div class="rk"><div class="rk-top"><span class="rk-no num">${o.rank}</span>
    <span class="iv" style="font-size:.95rem">${LEAGUES[o.league_id].name}${fl!=="通常"?"・"+esc(fl):""}</span>
    <span class="rk-meta">${o.memo?esc(o.memo):""}</span></div><div class="haves">${haveChip(o)}</div></div>`;}

/* ---------- ACCOUNT ---------- */
function renderAccount(){
  if(auth){
    main.innerHTML=`<div class="card"><h2>ログイン中</h2><div class="msg ok">${esc((auth.user&&auth.user.email)||"")}</div><button class="btn ghost" id="out">ログアウト</button></div>
      <p class="note">手持ちデータはあなたのアカウントにのみ保存され、他の人からは見えません（RLSで保護）。別の端末でも同じメール/パスワードでログインすれば同じ手持ちが見られます。</p>
      <p class="note" style="text-align:center;opacity:.7">ver. ${VERSION}</p>`;
    document.getElementById("out").addEventListener("click",()=>{
      saveAuth(null); ownedDex=new Set(); toast("ログアウトしました"); renderAccount();
    });
    return;
  }
  main.innerHTML=`<div class="card"><h2>ログイン / 新規登録</h2>
    <div class="field"><label>メールアドレス</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>パスワード</label><input id="pw" type="password" autocomplete="current-password" placeholder="6文字以上"></div>
    <div class="msg" id="amsg"></div>
    <div class="row2"><button class="btn" id="login" style="flex:1">ログイン</button><button class="btn ghost" id="signup" style="flex:1">新規登録</button></div></div>
    <p class="note">理想個体の閲覧はログイン不要。手持ちの記録にだけアカウントが必要です。</p>
    <p class="note" style="text-align:center;opacity:.7">ver. ${VERSION}</p>`;
  const em=()=>document.getElementById("email").value.trim(),pw=()=>document.getElementById("pw").value;
  const msg=(t,c="")=>{const m=document.getElementById("amsg");m.className="msg "+c;m.textContent=t;};
  document.getElementById("login").addEventListener("click",async()=>{
    const b=document.getElementById("login");b.disabled=true;msg("処理中…");
    try{await signIn(em(),pw());await loadOwnedDex();renderAccount();}
    catch(e){msg("ログイン失敗："+e.message,"err");b.disabled=false;}
  });
  document.getElementById("signup").addEventListener("click",async()=>{
    const b=document.getElementById("signup");b.disabled=true;msg("処理中…");
    try{await signUp(em(),pw());
      if(auth){await loadOwnedDex();renderAccount();}
      else{msg("確認メールを送信しました。メール内のリンクを開いた後、ログインしてください。","ok");b.disabled=false;}
    }catch(e){msg("登録失敗："+e.message,"err");b.disabled=false;}
  });
}

let toastT=null;
function toast(t){let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:60;box-shadow:var(--shadow-soft);opacity:0;transition:opacity .2s";document.body.appendChild(el);}
  el.textContent=t;requestAnimationFrame(()=>el.style.opacity="1");clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity="0",1800);}

boot();
</script>
